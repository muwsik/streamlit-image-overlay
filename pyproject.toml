[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-image-overlay"
version = "1.0.0"
description = "Interactive image overlay component for Streamlit"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

authors = [
    { name = "Muwsik", email = "nanoweb.assist@gmail.com" }
]

dependencies = [
    "streamlit>=1.55"
]

classifiers = [
    "Framework :: Streamlit",
    "Programming Language :: Python :: 3",
]


[project.optional-dependencies]
dev = [
    "wheel",
    "pytest==7.4.0",
    "playwright==1.48.0",
    "requests==2.31.0",
    "pytest-playwright-snapshot==1.0",
    "pytest-rerunfailures==12.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["streamlit_image_overlay*"]

[tool.setuptools.package-data]
streamlit_image_overlay = [
    "frontend/build/**/*",
]